[package]
name = "shinki-emu-siglus_rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
build = "build.rs"

[lib]
name = "shinki_emu_siglus_rs"
crate-type = ["rlib", "cdylib"]
doctest = false

[workspace]

[features]
default = []
dynamic = ["shinki-emu-abi/diagnostic-bridge"]

[dependencies]
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }
siglus_scene_vm = { path = "../../crates/siglus_scene_vm", default-features = false, features = ["native-audio", "pausable-clock"] }
pollster = "0.3"

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }

[package.metadata.shinki]
upstream = "https://github.com/xmoezzz/siglus_rs"
upstream_revision = "5f358ef1360b0439e92aed2b749e8f25d8721954"
fork = "https://github.com/Project-Shinkirou/siglus_rs"
fork_branch = "shinki"
base_revision = "13b55b47484faf8dfe03deb6ffd56ca0ec4ba3f2"
kira_upstream_revision = "dfb08d08d065930e9b257203bf11c6d34742f542"
kira_fork_revision = "a299b42690094a71885f6ed97dc504c4038da9a7"
cpal_fork_revision = "65ac8a6ac1a635cc26bfc5af331295b052044908"
license = "../../LICENSE-MPL-2.0"
license_notice = "../THIRD_PARTY_NOTICES.md"
modifications = "../MODIFICATIONS.md"
